<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3E2545" />
    <meta name="description" content="Angelz Desire — billing and inventory Admin Panel" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      id="webfonts"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
    />
    <!-- Promote the print stylesheet to all media once it loads, without an inline onload handler. -->
    <script>
      (function () {
        var sheet = document.getElementById('webfonts');
        if (!sheet) return;
        sheet.addEventListener('load', function promote() {
          sheet.media = 'all';
          sheet.removeEventListener('load', promote);
        });
      })();
    </script>
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Static title for a cold first paint; the script below restores the saved store name. -->
    <title>Angelz Desire — Admin</title>
    <script>
      try {
        var cachedName = localStorage.getItem('ab:siteName');
        if (cachedName) document.title = cachedName + ' — Admin';
      } catch (e) {}
    </script>
    <style>
      /* Painted before React mounts so there is no white flash on the ivory app. */
      html, body, #root { height: 100%; margin: 0; background: #FAF7F2; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        font-family: 'Cormorant Garamond', Georgia, serif; color: #3E2545;
        letter-spacing: .22em; font-size: 20px; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!-- Static store name for a cold first paint; the cached name below wins. -->
    <div id="root"><div id="boot">Angelz Desire</div></div>
    <script>
      try {
        var cached = localStorage.getItem('ab:siteName');
        if (cached) document.getElementById('boot').textContent = cached;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
