<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3E2545" />
    <meta name="description" content="Billing and inventory admin panel" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The stylesheet is fetched as a non-blocking `print` sheet and promoted to
      `all` once it lands, so a slow Google Fonts response can no longer hold up
      first paint. `display=swap` means text is readable in the fallback face
      until the webfont arrives, and the <noscript> copy keeps it working
      without JavaScript.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Admin</title>
    <style>
      /* Painted before React mounts so there is no white flash on the ivory app. */
      html, body, #root { height: 100%; margin: 0; background: #FAF7F2; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        font-family: 'Cormorant Garamond', Georgia, serif; color: #3E2545;
        letter-spacing: .22em; font-size: 20px; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"></div></div>
    <!--
      The store name is a setting, so this file cannot carry one. The splash
      paints the last name we saw instead, written to localStorage by
      SettingsContext (see src/utils/branding.js — keep the key in step). A
      first-ever visit has nothing cached and simply shows no wordmark.
    -->
    <script>
      try {
        var cached = localStorage.getItem('ab:siteName');
        if (cached) document.getElementById('boot').textContent = cached;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
